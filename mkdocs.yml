site_name: 'JumpServer API 文档'
site_url: 'https://docs.jumpserver.org'
site_author: '飞致云'
site_description: "JumpServer API 文档"

repo_name: 'jumpserver/jumpserver'
repo_url: 'https://github.com/jumpserver/jumpserver'
edit_uri: ''

theme:
  name: 'material'
  logo: 'img/logo.png'
  favicon: 'img/facio.ico'
  language: 'zh'
  palette:
    - scheme: default
      accent: 'red'
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      accent: 'red'
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
  font: false
  custom_dir: 'theme'
  icon:
    repo: fontawesome/brands/github

nav:
  - 免责声明: dev/api/disclaimer.md
  - 前言: dev/api/prologue_api.md
  - 认证方式:
    - 概述: dev/api/auth/auth.md
    - Session 认证: dev/api/auth/session.md
    - Token 认证: dev/api/auth/token.md
    - Private Token 认证: dev/api/auth/private_token.md
    - Access Key 认证: dev/api/auth/access_key.md
  - 用户:
    - 用户列表: dev/api/users/users.md
    - 用户组: dev/api/users/usergroups.md
  - 资产:
    - 资产列表: dev/api/assets/assets.md
    - 资产节点: dev/api/assets/nodes.md
    - 用户授权资产: dev/api/assets/authorization.md
  - 授权:
    - 资产授权: dev/api/perms/authorization.md
  - 账号:
    - 账号列表: dev/api/accounts/accounts.md
    - 查询账号密码: dev/api/accounts/accountsecrets.md
  - PAM:
    - 集成应用: dev/api/pam/integration-application.md
    - 改密计划: dev/api/pam/changepwd.md
    - 账号备份: dev/api/pam/account_backup.md
  - 工单:
    - 工单管理: dev/api/ticket/ticket.md
  - 审计:
    - 会话记录: dev/api/audits/sessions.md
    - 命令记录: dev/api/audits/commands.md
    - 文件传输记录: dev/api/audits/ftp_logs.md
    - 作业日志: dev/api/audits/job_logs.md
    - 登录日志: dev/api/audits/login_logs.md
    - 操作日志: dev/api/audits/operate_logs.md
    - 改密日志: dev/api/audits/password_change_logs.md
  - 健康检查:
    - 服务健康检查: dev/api/health/health.md
  - 终端:
    - 组件指标: dev/api/terminal/metrics.md
  - 实战案例:
    - 生成用户免密直连资产 URL: dev/api/examples/direct_connect_url.md
    - 对接外部工单系统: dev/api/examples/external_ticket.md
    - 外部系统申请资产并自动授权: dev/api/examples/asset_sync_authorize.md
    - 外部系统一键审计: dev/api/examples/one_click_audit.md
    - 用户生命周期自动化: dev/api/examples/user_lifecycle.md
    - 免硬编码获取账号密码: dev/api/examples/secret_retrieval.md
    - 健康检查与监控集成: dev/api/examples/monitor_integration.md
    - 审计日志对接 SIEM: dev/api/examples/siem_export.md

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: ⚓︎
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
      options:
        custom_icons:
          - theme/.icons
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.saneheaders
  - pymdownx.magiclink:
      repo_url_shortener: true
      repo_url_shorthand: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  jumpserver:
    tag: v4.10.9
  search:
    separator: '[\s\-\.]+'
    language: 'zh'
    Content-Encoding: gzip
    boost: 100
  generator: false
  version:
    default: master
    provider: mike
  analytics:
    provider: google
    property: UA-147297392-3
  social:
    - icon: Bilibili_Logo_Blue
      link: https://space.bilibili.com/510493147?spm_id_from=333.337.0.0
    - icon: fontawesome/brands/github
      link: https://github.com/jumpserver
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/jumpserver/
    - icon: fontawesome/solid/envelope
      link: mailto:support@fit2cloud.com
    - icon: fontawesome/brands/skype
      link: tel://400-052-0755

extra_css:
  - css/extra.css
  - css/termynal.css
  - css/custom.css
  - stylesheets/extra.css

extra_javascript:
  - js/termynal.js
  - js/custom.js

